name = "efck-sermon-watch"
main = "worker.js"
compatibility_date = "2026-09-01"

[triggers]
# */5 — ახალი ქადაგების შემოწმება. დანარჩენი — ყოველკვირეული
# შეხსენებები, UTC-ით (თბილისი = UTC + 4); რომელი რომელია, worker.js-ის
# REMINDERS-შია. დროის შეცვლისას ორივე ადგილას შეცვალე.
crons = ["*/5 * * * *", "0 5 * * 0", "0 10 * * 6", "0 13 * * 3"]

[observability]
enabled = true
