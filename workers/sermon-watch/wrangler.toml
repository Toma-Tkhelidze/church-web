name = "efck-sermon-watch"
main = "worker.js"
compatibility_date = "2026-09-01"

[triggers]
# ყოველ წუთს — ქადაგება (და ყოველ მე-5 წუთს რეგისტრაცია). დანარჩენი — ყოველკვირეული
# შეხსენებები, UTC-ით (თბილისი = UTC + 4); რომელი რომელია, worker.js-ის
# REMINDERS-შია. დროის შეცვლისას ორივე ადგილას შეცვალე.
crons = ["* * * * *", "0 5 * * SUN", "0 10 * * SAT", "0 13 * * WED"]

[observability]
enabled = true
