# ფორმების ყოველდღიური შემოწმება (scripts/check-forms.js).
#
# საიტის ფორმები Google Forms-ში ჩადის, მაგრამ ბრაუზერი Google-ის პასუხს
# ვერ კითხულობს — ვიზიტორი „გაიგზავნა“-ს ყოველთვის ხედავს. თუ ფორმა
# დაიხურა, კითხვა წაიშალა ან ახალი სავალდებულო კითხვა დაემატა, მონაცემი
# ჩუმად იკარგება. ეს სამუშაო დღეში ერთხელ ამოწმებს ყველა ფორმას; შეცდომისას
# ვარდება და GitHub რეპოზიტორიის მფლობელს ელფოსტას უგზავნის. დეტალები —
# Actions → ფორმების შემოწმება → ბოლო გაშვების Summary.
#
# მეორე ნაბიჯი ქადაგების მოდარაჯეს ამოწმებს (scripts/check-sermon-watch.js):
# ტოკენი მუშაობს და ვადის გასვლამდე 14 დღეზე მეტი რჩება.
#
# ხელით გაშვება: Actions → ფორმების შემოწმება → Run workflow.

name: ფორმების შემოწმება

on:
  schedule:
    - cron: '17 5 * * *'   # ყოველდღე, ~09:17 თბილისის დროით (GitHub შეიძლება დააგვიანოს)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Google Forms-ის შემოწმება
        run: node scripts/check-forms.js

      # იმავე ყოველდღიურ გაშვებაზე: მუშაობს თუ არა ქადაგების მოდარაჯე
      # (workers/sermon-watch) და როდის გასდის მის GitHub-ტოკენს ვადა.
      # აქ და არა ცალკე workflow-ში — რომ შეცდომის მეილი იმავე ადამიანს
      # მისვლოდა, ვისაც ფორმების შეცდომა მიდის.
      - name: ქადაგების მოდარაჯის შემოწმება
        if: ${{ !cancelled() }}
        run: node scripts/check-sermon-watch.js
