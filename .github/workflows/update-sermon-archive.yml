# საიტი ბოლო ქადაგებებს YouTube-ის feed-იდან იღებს, feed კი მხოლოდ
# ბოლო 10-ს გასცემს. სრული სია data/sermon-archive.json-შია. ეს
# სამუშაო ამ ფაილს კვირაში ერთხელ ანახლებს, რომ feed-ის ფანჯრიდან
# გასული ქადაგებები არ დაიკარგოს.
#
# გარდა ამისა, ყოველ 10 წუთში სწრაფად ამოწმებს, გამოჩნდა თუ არა ახალი
# ქადაგება (scripts/check-new-sermon.js). საიტი YouTube-ის ფიდს
# rss2json-ით კითხულობს, რომელიც მას საათამდე ინახავს — არქივი კი
# იმავე დომენზეა, ამიტომ ახალი ქადაგება ~10-20 წუთში ჩნდება.
# GitHub-ის განრიგი ზუსტი არ არის: დატვირთვისას გაშვება აგვიანებს.
#
# თუ ახალი ქადაგება მართლა გამოჩნდა, იმავე გაშვებაზე ელფოსტის
# შეტყობინებაც იგზავნება — იხ. ბოლო ნაბიჯი.
#
# ხელით გაშვება: Actions → ქადაგებების არქივის განახლება → Run workflow

name: ქადაგებების არქივის განახლება

on:
  schedule:
    # ორშაბათი, 06:00 UTC — თბილისში 10:00, კვირის ქადაგების ატვირთვის შემდეგ
    - cron: '0 6 * * 1'
    # სწრაფი შემოწმება — არქივს მხოლოდ ახალი ვიდეოს შემთხვევაში ადგენს.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'წერილი გაიგზავნოს ახალი ქადაგების გარეშეც (ტესტისთვის)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sermon-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # კვირეულ და ხელით გაშვებაზე არქივი ყოველთვის იგება; 10-წუთიანზე —
      # მხოლოდ მაშინ, როცა ფიდში არქივისთვის უცნობი ვიდეოა.
      - name: ახალი ქადაგების სწრაფი შემოწმება
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "*/10 * * * *" ]; then
            node scripts/check-new-sermon.js >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # ID-ს განახლებამდე და შემდეგ ვადარებთ. მარტო „ფაილი შეიცვალა“
      # არ კმარა: სათაურის შესწორებაც ცვლის ფაილს, წერილი კი მხოლოდ
      # ნამდვილ ახალ ქადაგებაზე უნდა გაიგზავნოს.
      - name: ბოლო ქადაგების ID — განახლებამდე
        if: steps.check.outputs.new == 'true'
        id: before
        run: echo "id=$(node scripts/send-sermon-email.js --print-latest)" >> "$GITHUB_OUTPUT"

      - name: არქივის შედგენა
        if: steps.check.outputs.new == 'true'
        run: node scripts/build-sermon-archive.js

      - name: ბოლო ქადაგების ID — განახლების შემდეგ
        if: steps.check.outputs.new == 'true'
        id: after
        run: echo "id=$(node scripts/send-sermon-email.js --print-latest)" >> "$GITHUB_OUTPUT"

      - name: ცვლილების ჩაწერა
        if: steps.check.outputs.new == 'true'
        run: |
          if git diff --quiet -- data/sermon-archive.json; then
            echo "ახალი ქადაგება არ არის — ცვლილება არ ჩაწერილა"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sermon-archive.json
          git commit -m "chore: ქადაგებების არქივის ავტომატური განახლება"
          git push

      # ჩამრთველი განზრახ ცალკეა: სანამ SERMON_MAIL_ENABLED ცვლადი
      # „true“ არ გახდება (Settings → Secrets and variables → Actions →
      # Variables), სკრიპტი მხოლოდ სატესტო რეჟიმში მუშაობს და
      # ჟურნალში წერს, რას გააგზავნიდა. შემთხვევით ვერაფერი გაიგზავნება.
      - name: შეტყობინება ელფოსტით
        if: steps.check.outputs.new == 'true' && steps.after.outputs.id != '' && (steps.before.outputs.id != steps.after.outputs.id || inputs.force_send)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ "${{ vars.SERMON_MAIL_ENABLED }}" = "true" ]; then
            node scripts/send-sermon-email.js
          else
            echo "SERMON_MAIL_ENABLED ჩართული არ არის — სატესტო რეჟიმი."
            node scripts/send-sermon-email.js --dry-run
          fi

      # იგივე ტრიგერი, მეორე არხი: ვინც აპლიკაციაში შეტყობინებები ჩართო.
      # ჩამრთველი ცალკეა (SERMON_PUSH_ENABLED), რომ ფოსტისგან
      # დამოუკიდებლად ჩაირთოს და გამოირთოს.
      - name: შეტყობინება აპლიკაციაში
        if: steps.check.outputs.new == 'true' && steps.after.outputs.id != '' && (steps.before.outputs.id != steps.after.outputs.id || inputs.force_send)
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          if [ "${{ vars.SERMON_PUSH_ENABLED }}" = "true" ]; then
            node scripts/send-sermon-push.js
          else
            echo "SERMON_PUSH_ENABLED ჩართული არ არის — სატესტო რეჟიმი."
            node scripts/send-sermon-push.js --dry-run
          fi
